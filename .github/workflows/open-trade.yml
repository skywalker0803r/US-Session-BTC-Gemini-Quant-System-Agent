name: Open BTC trade

on:
  schedule:
    - cron: "45 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  open-trade:
    max-parallel: 1

jobs:
  open-trade:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run live decision and order
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GATEIO_API_KEY: ${{ secrets.GATEIO_API_KEY }}
          GATEIO_SECRET: ${{ secrets.GATEIO_SECRET }}
          ALLOW_LIVE_TRADING: "true"
        run: |
          mkdir -p ./events
          python -m quant_agent.cli --mode live --action open --events ./events

      - name: Upload audit events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-trade-audit
          path: ./events
          if-no-files-found: ignore
          retention-days: 30
